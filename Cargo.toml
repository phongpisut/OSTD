[package]
name = "paper-translate"
version = "0.3.0"
edition = "2024"

[dependencies]
eframe = "0.37.0"
global-hotkey = "0.9.0"
ort = { version = "2.0.0-rc.15", default-features = false, features = ["std", "ndarray", "download-binaries", "directml", "copy-dylibs", "tls-native"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tray-icon = "0.26.1"
ureq = { version = "3.5.0", features = ["json"] }
windows = { version = "0.62.2", features = ["Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Globalization", "Foundation", "Foundation_Collections", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Graphics_Dxgi", "Win32_System_SystemInformation", "Win32_UI_Shell", "Win32_System_LibraryLoader"] }
zip = "9.0.5"

[build-dependencies]
winresource = "0.1.34"
